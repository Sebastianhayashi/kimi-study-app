name: Feature request
description: Propose a learner-visible or engineering improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Learner problem
      description: Describe the problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible or clearer for the learner?
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: Affected journey
      placeholder: Upload → generation → first lesson → tutor → next lesson
  - type: textarea
    id: behavior
    attributes:
      label: Expected visible behavior
      description: Include controls, states, progress, errors, mobile behavior, and accessibility expectations when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: verification
    attributes:
      label: Suggested acceptance test
      description: Explain how a browser or unit test could prove the outcome.
