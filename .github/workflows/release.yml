name: Release source archive

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release gate
        run: |
          npm run check
          npm test
          npm run fixtures:build
          LUCUBRO_DATA_DIR=tests/.runtime/courses npm run fixtures:seed -- --clean
          npm run test:e2e:ci

      - name: Build clean source archive
        shell: bash
        run: |
          set -euo pipefail
          staging="release/lucubro-${RELEASE_TAG}"
          mkdir -p "$staging"
          rsync -a ./ "$staging/" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'data/courses/' \
            --exclude 'tests/.runtime/' \
            --exclude 'tests/.generated/' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            --exclude 'blob-report/' \
            --exclude 'release/'
          (cd release && zip -qr "lucubro-${RELEASE_TAG}.zip" "lucubro-${RELEASE_TAG}")
          sha256sum "release/lucubro-${RELEASE_TAG}.zip" > "release/SHA256SUMS.txt"

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "release/lucubro-${RELEASE_TAG}.zip" \
              "release/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "release/lucubro-${RELEASE_TAG}.zip" \
              "release/SHA256SUMS.txt" \
              --verify-tag \
              --generate-notes \
              --title "Lucubro ${RELEASE_TAG}"
          fi
