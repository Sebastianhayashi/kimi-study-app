name: Quality and browser tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Static, unit, and Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      LUCUBRO_E2E_PORT: "3107"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify clean production course data before tests
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- data/courses)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Run static checks
        run: npm run check

      - name: Run Node tests
        run: npm test

      - name: Run Chromium end-to-end tests
        run: npx playwright test --workers=1

      - name: Verify production course data remained unchanged
        if: ${{ always() }}
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- data/courses)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Upload Playwright reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
