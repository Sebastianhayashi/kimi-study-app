name: One-shot real Claude smoke

on:
  push:
    branches:
      - main
    paths:
      - scripts/company-real-claude-smoke.js
      - .github/workflows/one-shot-real-claude-smoke.yml

permissions:
  contents: read
  issues: write

jobs:
  real-claude-smoke:
    runs-on: [self-hosted, lucubro-local]
    timeout-minutes: 15
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          clean: true
          persist-credentials: false

      - name: Install repository dependencies
        run: npm ci

      - name: Probe Claude CLI login non-interactively
        id: cli
        shell: bash
        run: |
          set +e
          {
            echo "== claude version =="
            claude --version
            echo "== claude print-mode auth probe =="
            timeout 90s claude -p 'Reply exactly LUCUBRO_CLI_OK and nothing else.' --output-format text
          } > claude-cli-probe.log 2>&1
          code=$?
          cat claude-cli-probe.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install Claude Agent SDK for smoke only
        run: npm install --no-save --no-package-lock @anthropic-ai/claude-agent-sdk

      - name: Run isolated real Claude SDK smoke
        id: sdk
        shell: bash
        env:
          CI: "true"
        run: |
          set +e
          node scripts/company-real-claude-smoke.js > real-claude-smoke.log 2>&1
          code=$?
          cat real-claude-smoke.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report smoke result
        if: always()
        uses: actions/github-script@v7
        env:
          CLI_EXIT_CODE: ${{ steps.cli.outputs.exit_code }}
          SDK_EXIT_CODE: ${{ steps.sdk.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const cli = fs.existsSync('claude-cli-probe.log')
              ? fs.readFileSync('claude-cli-probe.log', 'utf8')
              : 'CLI probe did not produce a log file.';
            const sdk = fs.existsSync('real-claude-smoke.log')
              ? fs.readFileSync('real-claude-smoke.log', 'utf8')
              : 'SDK smoke did not produce a log file.';
            const body = [
              `Trusted device: ${process.env.RUNNER_NAME}`,
              `Commit: ${context.sha}`,
              `Claude CLI exit: ${process.env.CLI_EXIT_CODE || 'unknown'}`,
              `Claude Agent SDK exit: ${process.env.SDK_EXIT_CODE || 'unknown'}`,
              '',
              '## CLI probe',
              '```text',
              cli.slice(-5000),
              '```',
              '',
              '## SDK smoke',
              '```text',
              sdk.slice(-9000),
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[device-smoke] Claude CLI ${process.env.CLI_EXIT_CODE || '?'} SDK ${process.env.SDK_EXIT_CODE || '?'} ${context.sha.slice(0, 7)}`,
              body,
            });

      - name: Verify repository remains clean
        if: always()
        run: git status --short

      - name: Fail if both Claude paths are unavailable
        if: steps.cli.outputs.exit_code != '0' && steps.sdk.outputs.exit_code != '0'
        run: exit 1
