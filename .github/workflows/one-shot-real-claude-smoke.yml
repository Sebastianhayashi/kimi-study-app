name: One-shot real Claude smoke

on:
  push:
    branches:
      - main
    paths:
      - scripts/company-real-claude-smoke.js
      - .github/workflows/one-shot-real-claude-smoke.yml

permissions:
  contents: read
  issues: write

jobs:
  real-claude-smoke:
    runs-on: [self-hosted, lucubro-local]
    timeout-minutes: 15
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v5
        with:
          ref: main
          clean: true
          persist-credentials: false

      - name: Install repository dependencies
        run: npm ci

      - name: Install Claude Agent SDK for smoke only
        run: npm install --no-save --no-package-lock @anthropic-ai/claude-agent-sdk

      - name: Run isolated real Claude smoke
        id: smoke
        shell: bash
        env:
          CI: "true"
        run: |
          set +e
          node scripts/company-real-claude-smoke.js > real-claude-smoke.log 2>&1
          code=$?
          cat real-claude-smoke.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report smoke result
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_EXIT_CODE: ${{ steps.smoke.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('real-claude-smoke.log')
              ? fs.readFileSync('real-claude-smoke.log', 'utf8')
              : 'Smoke did not produce a log file.';
            const body = [
              `Trusted device: ${process.env.RUNNER_NAME}`,
              `Commit: ${context.sha}`,
              `Exit code: ${process.env.SMOKE_EXIT_CODE || 'unknown'}`,
              '',
              '```text',
              raw.slice(-12000),
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[device-smoke] real Claude ${context.sha.slice(0, 7)} exit ${process.env.SMOKE_EXIT_CODE || 'unknown'}`,
              body,
            });

      - name: Verify repository remains clean
        if: always()
        run: git status --short

      - name: Fail if real Claude smoke failed
        if: steps.smoke.outputs.exit_code != '0'
        run: exit 1
