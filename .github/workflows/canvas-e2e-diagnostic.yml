name: Canvas E2E diagnostic

on:
  push:
    branches:
      - design/klein-blue-company-v3
    paths:
      - .github/workflows/canvas-e2e-diagnostic.yml
      - public/company.html
      - public/company-workspace.js
      - public/company-pages.js
      - public/company-canvas-shell.css
      - tests/e2e/company-workspace-pages.spec.js

permissions:
  contents: read
  issues: write

jobs:
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Company Canvas browser contract
        id: canvas
        shell: bash
        run: |
          set +e
          npx playwright test tests/e2e/company-workspace-pages.spec.js --workers=1 > canvas-e2e.log 2>&1
          code=$?
          set -e
          cat canvas-e2e.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Probe Workspace controller runtime
        shell: bash
        run: |
          set -e
          probe_root="$RUNNER_TEMP/lucubro-workspace-probe"
          rm -rf "$probe_root"
          mkdir -p "$probe_root/Projects"
          NODE_ENV=test \
          LUCUBRO_COMPANY_PORT=3112 \
          LUCUBRO_COMPANY_DATA_DIR="$probe_root/data" \
          LUCUBRO_COMPANY_MOCK_RUNTIME=1 \
          LUCUBRO_WORKSPACE_ROOT="$probe_root" \
          node company-server.js > probe-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3112/api/company/health >/dev/null; then break; fi
            sleep 0.05
          done
          node <<'NODE' > workspace-probe.log 2>&1
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const events = [];
            page.on('pageerror', (error) => events.push(`PAGEERROR ${error.stack || error.message}`));
            page.on('console', (message) => {
              if (message.type() === 'error' || message.type() === 'warning') events.push(`CONSOLE_${message.type().toUpperCase()} ${message.text()}`);
            });
            page.on('response', (response) => {
              if (response.url().endsWith('/company-workspace.js')) events.push(`WORKSPACE_SCRIPT ${response.status()} ${response.headers()['content-type'] || ''}`);
            });
            await page.goto('http://127.0.0.1:3112/company', { waitUntil: 'networkidle' });
            const ids = [
              'workspace-picker','workspace-tree-toggle','workspace-tree-panel','workspace-tree','workspace-root-label',
              'workspace-new-folder','workspace-create-form','workspace-create-name','workspace-create-cancel','repo-dir',
              'workspace-suggestions','repo-path-control','repo-path-note','repo-path-receipt','repo-path-scan',
              'workspace-drop-receipt','workspace-drop-receipt-title','workspace-drop-receipt-copy','run-settings'
            ];
            const snapshot = await page.evaluate((ids) => Object.fromEntries(ids.map((id) => [id, Boolean(document.getElementById(id))])), ids);
            events.push(`DOM ${JSON.stringify(snapshot)}`);
            events.push(`CONTROLLER ${await page.locator('#workspace-picker').getAttribute('data-controller')}`);
            await page.locator('#run-settings > summary').click();
            await page.locator('#repo-dir').fill('/tmp/example');
            await page.waitForTimeout(500);
            events.push(`STATE ${await page.locator('#repo-path-control').getAttribute('data-state')}`);
            await page.locator('#workspace-tree-toggle').click();
            await page.waitForTimeout(100);
            events.push(`TREE_HIDDEN ${await page.locator('#workspace-tree-panel').getAttribute('hidden')}`);
            events.push(`GSAP ${await page.evaluate(() => typeof window.gsap)}`);
            console.log(events.join('\n'));
            await browser.close();
          })().catch((error) => { console.error(error.stack || error); process.exitCode = 1; });
          NODE
          cat workspace-probe.log
      - name: Report result
        uses: actions/github-script@v7
        env:
          CANVAS_EXIT: ${{ steps.canvas.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('canvas-e2e.log', 'utf8');
            const probe = fs.existsSync('workspace-probe.log') ? fs.readFileSync('workspace-probe.log', 'utf8') : 'probe log missing';
            const tail = log.length > 18000 ? log.slice(-18000) : log;
            const exitCode = process.env.CANVAS_EXIT || 'unknown';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[canvas-diagnostic] ${context.sha.slice(0, 7)} exit ${exitCode}`,
              body: `Temporary Company Canvas E2E diagnostic.\n\nCommit: \`${context.sha}\`\nExit: \`${exitCode}\`\n\n### Workspace runtime probe\n\n\`\`\`text\n${probe}\n\`\`\`\n\n### E2E tail\n\n\`\`\`text\n${tail}\n\`\`\``,
            });
      - name: Fail after report
        if: steps.canvas.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.canvas.outputs.exit_code }}"
