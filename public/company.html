<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucubro · Company</title>
  <link rel="stylesheet" href="/vendor/geist/wght.css">
  <link rel="stylesheet" href="/company.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/company" aria-label="Lucubro Company home"><span class="brand-mark">L</span><span>Lucubro</span></a>
      <div class="manager-identity"><span class="avatar">A</span><span><strong>Alex</strong><small>Primary Manager</small></span></div>
      <button id="needs-you-button" class="attention-button" type="button" aria-expanded="false"><span id="needs-you-count">0</span> need you</button>
    </header>

    <main class="conversation" aria-label="Manager conversation">
      <section id="conversation-feed" class="conversation-feed" aria-live="polite">
        <article class="message manager-message">
          <div class="message-author">Alex</div>
          <p>What should we move forward?</p>
          <p class="quiet">I’ll turn a concrete coding request into Work, assign Ben, and keep execution details out of your way unless a decision needs you.</p>
        </article>
      </section>
    </main>

    <aside id="needs-you-panel" class="needs-you-panel" aria-label="Needs you" hidden>
      <div class="panel-header"><strong>Needs you</strong><button id="close-needs-you" type="button" aria-label="Close">×</button></div>
      <div id="needs-you-list" class="needs-you-list"><p class="quiet">Nothing needs your decision.</p></div>
    </aside>

    <footer class="composer-wrap">
      <form id="work-form" class="composer">
        <label class="sr-only" for="work-brief">Tell Alex what to do</label>
        <textarea id="work-brief" rows="2" placeholder="Tell Alex what you want done…" required></textarea>
        <div class="composer-footer">
          <details class="run-settings">
            <summary>Run settings</summary>
            <div class="settings-grid">
              <label>Repository path<input id="repo-dir" name="repoDir" placeholder="/absolute/path/to/repo" required></label>
              <label>Runtime<select id="runtime" name="runtime"></select></label>
            </div>
          </details>
          <button id="send-work" class="primary-action" type="submit">Send</button>
        </div>
      </form>
      <p id="runtime-note" class="runtime-note"></p>
    </footer>
  </div>
  <script src="/company.js" defer></script>
</body>
</html>
